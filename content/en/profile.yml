headline: Software Engineer building elegant web experiences.

location: Brazil

biography: |-
  Hi! I’m Gabriel, I am a Software Engineer with over five years of experience delivering robust digital solutions for companies across the globe. My work spans industries such as telecommunications, cybersecurity, blockchain, and artificial intelligence, equipping me with a strong foundation to solve complex challenges and adapt quickly to new technologies.

  Skilled in both backend and frontend development, I build scalable applications using modern languages and frameworks. I have hands-on experience with cloud platforms like AWS and GCP, as well as containerisation tools including Docker and Docker Swarm, and learning about Kubernetes. My background also includes database management (MySQL, PostgreSQL, MongoDB, Redis) and blockchain development with Solidity and smart contracts.

  In addition to my technical expertise, I’m a strong communicator and problem solver who thrives in collaborative, agile environments. I'm well-versed in Scrum, Kanban, and eXtreme Programming, and comfortable working with distributed and multicultural teams. I’m particularly interested in AI and Web 3.0, and always eager to contribute to innovative, high-impact projects.

description: |-
  The specialisation course in Software Architecture at Anhanguera College is aimed at professionals in the area of ​​information technology, experienced in software development, who want to expand their skills in creating critical and high-level solutions on various information technology platforms. The objectives of the specialisation include: analysing and architecting software, including Data Warehouse architecture; designing high-level and cloud architecture models; architecting software using Design Patterns and Configuration Management; understanding Web Services and Microservices in software architecture; and integrating applications with DevOps principles.


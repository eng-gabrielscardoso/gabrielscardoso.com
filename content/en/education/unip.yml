degree: Technologist

course: Supply Chain and Logistics Management

fieldOfStudy: Supply Chain and Logistics Management

school: Universidade Paulista

description: |-
  The Logistics Technology Course aims to train professionals capable of planning, putting into operation and controlling the logistics activities of a company, using up-to-date management methodologies and technologies and identifying opportunities to reduce costs, increase the quality of services in and increasing the quality of meeting the deadline.  The professional will be prepared to optimize the processes of acquisition, storage and distribution of materials within the supply chain concept (supply-chain), as well as to analyze aspects of dimension and location of Distribution Centers, aiming at minimizing operating costs and taxes, without loss in the quality of services, and enabling competitive advantages for the company.

startDate: '2019-08'

endDate: '2021-07'

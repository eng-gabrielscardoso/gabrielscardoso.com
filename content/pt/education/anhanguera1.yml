description: |-
  O curso de especialização em Arquitetura de Software da Anhanguera é voltado a profissionais de tecnologia da informação, experientes em desenvolvimento de software, que desejam ampliar suas competências na criação de soluções críticas e de alto nível em diversas plataformas de TI. Os objetivos incluem: analisar e arquitetar software, incluindo arquitetura de Data Warehouse; projetar modelos de arquitetura de alto nível e em cloud; arquitetar software usando Design Patterns e Configuration Management; compreender Web Services e Microservices em arquitetura de software; e integrar aplicações com princípios de DevOps.


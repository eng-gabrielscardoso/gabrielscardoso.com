degree: Tecnólogo

course: Gestão da Cadeia de Suprimentos e Logística

fieldOfStudy: Gestão da Cadeia de Suprimentos e Logística

school: Universidade Paulista

description: |-
  O Curso Superior de Tecnologia em Logística forma profissionais capazes de planejar, colocar em operação e controlar as atividades logísticas de uma empresa, utilizando metodologias e tecnologias de gestão atualizadas e identificando oportunidades de redução de custos, aumento da qualidade dos serviços e melhoria no cumprimento de prazos. O profissional estará preparado para otimizar os processos de aquisição, armazenagem e distribuição de materiais dentro do conceito de supply chain, além de analisar aspectos de dimensionamento e localização de Centros de Distribuição, visando minimizar custos operacionais e tributários, sem perda na qualidade dos serviços, e gerando vantagens competitivas para a empresa.

startDate: '2019-08'


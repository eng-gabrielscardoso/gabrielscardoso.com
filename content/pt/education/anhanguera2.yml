degree: MBA

course: Administração e Gestão de Tecnologia da Informação

fieldOfStudy: Administração e Gestão de Tecnologia da Informação

school: Anhanguera Educacional

description: |-
  O curso é destinado a profissionais com formação em diferentes áreas, dos setores público ou privado, que atuam ou pretendem atuar em funções envolvendo a gestão, implementação e/ou uso de recursos avançados de Tecnologia da Informação. Também é recomendado para quem deseja obter e/ou atualizar conhecimentos técnicos e gerenciais na área. Os objetivos incluem: promover o desenvolvimento humano com responsabilidade social e profissional, atendendo às necessidades das diversas formas de organização impostas pela sociedade contemporânea, com abordagem centrada no humanismo e na cultura como fontes do sistema social; e adquirir conhecimentos, desenvolver métodos, dominar técnicas e estruturar planos e projetos de gestão na área de TI.


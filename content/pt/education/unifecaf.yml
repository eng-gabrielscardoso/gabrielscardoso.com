description: |-
  O curso de pós-graduação lato sensu em Engenharia de Software da Faculdade FECAF apresenta os principais tópicos do processo de desenvolvimento de software em times ágeis e em um mercado competitivo como o atual, abordando métricas de qualidade de software, avaliação de software, processo de desenvolvimento e gestão de projetos de software. Possui carga horária de 360 horas dividida em módulos, com exames de aptidão, imergindo o aluno em conteúdo extenso, leituras, cases, prática e orientação com tutores.


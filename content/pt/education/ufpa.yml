degree: Bacharelado

course: Sistemas de Informação

fieldOfStudy: Sistemas de Informação

school: Universidade Federal do Pará

description: |-
  O Bacharelado em Sistemas de Informação da Universidade Federal do Pará tem como objetivo formar um profissional competente, ativo, empreendedor e ético, consciente de seu papel social e de sua contribuição para o avanço científico e tecnológico da região Pará-Amazônia. O perfil profissional contempla domínio das tecnologias da informação, promoção do desenvolvimento tecnológico e inovador, capacidade de desenvolver espírito empreendedor na busca por soluções a desafios organizacionais e novas oportunidades de crescimento profissional, além de uma visão humanística crítica e consistente sobre o impacto das atividades profissionais na sociedade.


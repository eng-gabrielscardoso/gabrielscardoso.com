headline: Engenheiro de Software construindo experiências web elegantes.

location: Brasil

biography: |-
  Olá! Sou Gabriel, Engenheiro de Software com mais de cinco anos de experiência entregando soluções digitais robustas para empresas ao redor do mundo. Atuo em setores como telecomunicações, cibersegurança, blockchain e inteligência artificial, o que me dá uma base sólida para resolver problemas complexos e me adaptar rapidamente a novas tecnologias.

  Habilidoso tanto no backend quanto no frontend, construo aplicações escaláveis com linguagens e frameworks modernos. Tenho experiência prática com plataformas cloud como AWS e GCP, além de ferramentas de containerização como Docker e Docker Swarm, e estou aprendendo Kubernetes. Minha formação também inclui gestão de bancos de dados (MySQL, PostgreSQL, MongoDB, Redis) e desenvolvimento blockchain com Solidity e smart contracts.

  Além da expertise técnica, sou um comunicador e resolvedor de problemas que se dá bem em ambientes colaborativos e ágeis. Domino Scrum, Kanban e eXtreme Programming, e me sinto confortável trabalhando com times distribuídos e multiculturais. Tenho interesse especial em IA e Web 3.0, e estou sempre disposto a contribuir com projetos inovadores e de alto impacto.

translated: true

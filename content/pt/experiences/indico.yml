  - Contribuí para especificação técnica e design arquitetural, fazendo a ponte entre requisitos de projeto e execução técnica por meio de participação ativa em reuniões com stakeholders.
  - Desenvolvi interfaces polidas com Material UI e TailwindCSS, garantindo uma linguagem de design consistente e intuitiva em todos os produtos voltados ao cliente.


description: |-
  - Arquitetei e modernizei infraestruturas complexas, migrando sistemas legados para arquiteturas de microserviços escaláveis para clientes como Perto e Zuki.
  - Liderei o desenvolvimento frontend full-lifecycle em diversos frameworks, incluindo Angular, React (Next.js) e Vue (Nuxt.js), utilizando Vite, Pinia e TailwindCSS para entregar interfaces de alta performance.

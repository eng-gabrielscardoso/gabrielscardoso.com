  - Orquestrei ambientes containerizados com Docker e Docker Swarm, gerenciando service discovery e deploy por meio de NGINX e mensageria assíncrona com RabbitMQ.
  - Implementei soluções cloud escaláveis na AWS, utilizando EC2, Lambda, RDS e Cognito para construir aplicações seguras, serverless e orientadas a eventos.
  - Simplifiquei fluxos de desenvolvimento fornecendo consultoria especializada e mapeamento de processos, garantindo que especificações técnicas estivessem alinhadas aos objetivos de negócio.
  - Projetei e apliquei rotinas rigorosas de conformidade e testes, estabelecendo regulamentos internos e padrões de documentação que melhoraram a qualidade do produto e a eficiência do time.
  - Gerenciei ambientes diversos de banco de dados, otimizando PostgreSQL, MySQL e Redis para processamento de dados em larga escala e cache em tempo real.


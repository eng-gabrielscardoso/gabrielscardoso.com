description: |-
  - Liderei o desenvolvimento de sistemas baseados em blockchain, com foco em Ethereum, Hyperledger Fabric e Besu para entregar arquiteturas descentralizadas robustas.
  - Fui pioneiro na plataforma "Sustainability Articles" para a Caixa Econômica Federal, um projeto de referência que integra tecnologia blockchain com o sistema de pagamentos Pix para impulsionar iniciativas ambientais e de sustentabilidade.

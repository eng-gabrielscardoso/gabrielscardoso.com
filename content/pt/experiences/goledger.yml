  - Desenvolvi pilotos de ponta usando Zero-Knowledge Proofs (ZKP), aprimorando privacidade e soberania de dados em frameworks de ledger distribuído.
  - Construí serviços backend de alta performance com Go, Node.js e React, seguindo padrões rigorosos de segurança e princípios de Clean Code.
  - Colaborei de perto com o time core da GoLedger para traduzir requisitos de negócio complexos em especificações técnicas escaláveis, garantindo alinhamento com os objetivos dos stakeholders.
  - Otimizei sistemas descentralizados de gestão de documentos, garantindo conformidade total com padrões de confidencialidade e proteção de dados da indústria.


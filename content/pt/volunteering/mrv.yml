role: Presidente de MRV

organisation: Tribunal Regional Eleitoral do Pará

cause: politics

description: |-
  O presidente de mesa receptora de votos é responsável por conduzir os trabalhos na seção eleitoral e deve:
  - Manter a ordem no local, recorrendo às forças de segurança pública, quando necessário
  - Solucionar problemas e esclarecer dúvidas que surgirem
  - Comunicar imediatamente ao Cartório eventos sobre os quais o juiz ou juiz eleitoral deva decidir
  - Iniciar e encerrar a votação
  - Providenciar a entrega dos materiais da seção, após o término da votação, conforme orientações do Cartório Eleitoral
  - Atribuir responsabilidades aos demais membros da mesa
  - Conferir as credenciais dos fiscais de partidos políticos, federações partidárias e membros de Missões de Observação Eleitoral

startDate: '2022-10'

endDate: '2022-10'

